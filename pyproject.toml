[project]
name = "foodcheat-ai-vision"
version = "0.1.0"
description = "Multi-component food calorie estimation R&D via OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=10.3",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "pandas>=2.2",
    "jinja2>=3.1",
]

[project.scripts]
foodcheat-benchmark = "foodcheat.evaluation.runner:main"
foodcheat-app = "app_streamlit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foodcheat"]

[tool.uv]
dev-dependencies = []
package = false
